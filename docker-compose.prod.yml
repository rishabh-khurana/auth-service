services:
  # ===========================================================================
  # APPLICATION SERVICE - compiled production build
  # Secrets must be injected via shell environment — no .env file
  # ===========================================================================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: auth-app
    ports:
      - "${PORT:-3420}:3420"
    env_file:
      .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3420}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3420/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # POSTGRESQL DATABASE
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    env_file:
      .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - auth-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  auth_postgres_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  auth-network:
    driver: bridge
